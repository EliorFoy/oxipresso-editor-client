[package]
name = "oxipresso-editor-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Live TeX preview GUI for the Oxipresso render server (a TeXpresso-style editor client)"
repository = "https://github.com/EliorFoy/oxipresso-editor-client"

[[bin]]
name = "oxipresso-editor-client"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
oxipresso-editor-protocol = { git = "https://github.com/EliorFoy/oxipresso" }
oxipresso-engine-api = { git = "https://github.com/EliorFoy/oxipresso" }
oxipresso-render = { git = "https://github.com/EliorFoy/oxipresso", features = ["freetype"] }
oxipresso-synctex = { git = "https://github.com/EliorFoy/oxipresso" }
slint = "1.17"
rfd = "0.15"

[features]
default = []
